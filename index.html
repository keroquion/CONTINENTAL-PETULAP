<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Petulap: soporte técnico, mantenimiento y repotenciación de laptops.">
    <title>Petulap - Servicio Técnico de Laptops</title>
    <!-- Bootstrap 5 CSS Local -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header: Barra de navegación -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Petulap</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Mostrar menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="index.html" aria-current="page">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link" href="diagnosticos.html">Diagnósticos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section id="inicio" class="hero-section text-center py-5 text-white">
            <div class="container">
                <h1 class="display-5 fw-bold mb-3">Soporte Técnico Especializado en Laptops</h1>
                <p class="lead mb-0">Diagnóstico rápido, repotenciación y reparación profesional garantizada.</p>
            </div>
        </section>

        <!-- Vista 1: Catálogo de servicios (datos desde CatalogoService) -->
        <section id="servicios" class="py-5">
            <div class="container">
                <h2 class="text-center fw-bold mb-4">Nuestros Servicios</h2>
                <p id="mensajeServicios" class="text-center text-muted" role="status"></p>
                <div id="listaServicios" class="row g-4"></div>
                <p class="text-center mt-5">
                    <a href="diagnosticos.html" class="btn btn-primary btn-lg">Registrar una falla</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">Derechos reservados para Kevin Quicaño Condori</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Local -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- Capa de servicio -->
    <script src="js/servicios/CatalogoService.js"></script>
    <!-- Capa de presentación -->
    <script src="js/vistas/catalogoVista.js"></script>
</body>
</html>
